name: Azure Backend Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install (at monorepo root)
        run: npm install

      - name: Bundle backend + node_modules for deploy
        run: |
            mkdir -p deploy
            cp -r packages/express-backend/. deploy/
            cp -r node_modules deploy/node_modules

            cd deploy
            cd node_modules
            tar -czf ../node_modules.tar.gz .
            cd ..
            rm -rf node_modules

            zip -ry $GITHUB_WORKSPACE/release.zip .
            tar -tzf node_modules.tar.gz | head -10

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'csc307-booktracker'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2DF3CD8DD21B436494CCE108969507FB }}