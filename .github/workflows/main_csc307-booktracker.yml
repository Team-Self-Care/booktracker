name: Build and deploy Node.js app to Azure Web App - csc307-booktracker

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install
        run: npm install
        working-directory: packages/express-backend

      - name: Verify node_modules exists
        run: ls packages/express-backend/node_modules | head -10

      - name: Zip artifact for deployment
        run: |
          cd packages/express-backend
          zip -r $GITHUB_WORKSPACE/release.zip . -x "*.git*"

      - name: Verify zip contains node_modules
        run: unzip -l $GITHUB_WORKSPACE/release.zip | grep "node_modules/express" | head -10

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: release.zip
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Verify downloaded zip
        run: |
            unzip -l release.zip
            npm install

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'csc307-booktracker'
          slot-name: 'Production'
          package: release.zip
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_2DF3CD8DD21B436494CCE108969507FB }}